# ===================================================================
# 1. 시스템 전역 인코딩 및 서버 설정 (Input length = 1 오류 완벽 방지)
# ===================================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# 서버 실행 포트 번호 고정
server.port=8803

# ===================================================================
# 2. Claude API 연동 설정 (향후 실제 연동 대비)
# ===================================================================
# 실제 API 호출 주소인 엔드포인트 게이트웨이 주소
anthropic.api.url=https://api.anthropic.com

# Claude API KEY는 환경 변수로 설정 (GitHub에 노출되지 않음)
# 설정하지 않으면 README 생성을 스킵함
anthropic.api.key=${CLAUDE_API_KEY:}

# ===================================================================
# 2.1 LLM 제공자 전환 설정 (scenario_0.md — 설정만으로 Claude API ↔ 로컬/사내 LLM 전환)
# ===================================================================
# LLM 제공자 선택: anthropic(기본) 또는 local. 재빌드 없이 이 값(또는 LLM_PROVIDER 환경변수)만
# 바꾸고 재시작하면 전환된다. 기본값은 anthropic이라 이 블록이 배포돼도 기존 동작은 바뀌지 않는다.
llm.provider=${LLM_PROVIDER:anthropic}

# OpenAI 호환 로컬/사내 LLM 연동 설정 (값은 시나리오별로 다름 — docs/advancement/scenario/ 참고)
llm.local.url=${LLM_LOCAL_URL:}
llm.local.model=${LLM_LOCAL_MODEL:}
# 비워두면 Authorization 헤더 자체를 생략(Ollama 등 무인증 백엔드 대응)
llm.local.api-key=${LLM_LOCAL_API_KEY:}
llm.local.max-tokens=8192
# 로컬/사내 추론은 Claude API보다 느릴 수 있으므로 읽기 타임아웃을 넉넉히
llm.local.read-timeout-sec=300
# 코드 분석은 창작이 아니라 사실 추출 작업이라 낮게 잡음(기본값 0.2) — 소형 로컬 모델일수록
# temperature가 높으면 시스템 프롬프트의 예시 문장을 창작하듯 베끼거나 근거 없는 내용을
# 지어내는 경향이 커진다(2026-07-23 scenario_1 실측으로 확인). 모델/시나리오별로 조정 가능.
llm.local.temperature=${LLM_LOCAL_TEMPERATURE:0.2}
# 분석 스레드 풀(app.analysis.thread-pool-size, 기본 16)이 동시에 이 값보다 많은 요청을
# 로컬 LLM에 보내면, CPU 전용 백엔드(보통 요청을 하나씩만 처리)에서는 뒤에 밀린 요청이
# 처리되기도 전에 read-timeout을 넘겨 대량 실패한다(2026-07-23 실측: 100파일 중 91개 실패,
# 성공률 7%). 기본값 1로 실제 동시 전송 요청 수를 강제 직렬화 — GPU 등 실제 병렬 서빙되는
# 백엔드면 시나리오별로 올려서 튜닝 가능.
llm.local.max-concurrent-calls=${LLM_LOCAL_MAX_CONCURRENT_CALLS:1}

# ===================================================================
# 2.2 RAG(Chroma) 설정 — 대형 Java 프로젝트 README 생성 시 패키지 구조 텍스트 압축
# (plan.md "RAG(Chroma)" 절, scenario_1.md 채택 확정 2026-07-23)
# ===================================================================
# 기본값 false — 꺼져 있으면 com.legacy.rag의 빈이 아예 등록되지 않아 기존 동작과 100% 동일.
# scenario_1(경량 배포판)처럼 로컬 LLM+Chroma를 함께 띄우는 환경에서만 true로 켠다.
rag.enabled=${RAG_ENABLED:false}
rag.chroma.url=${RAG_CHROMA_URL:}
rag.chroma.tenant=${RAG_CHROMA_TENANT:default_tenant}
rag.chroma.database=${RAG_CHROMA_DATABASE:default_database}
# llm.local.url(같은 Ollama 서버)에 이 모델로 임베딩 요청을 보낸다 — docker/ollama-entrypoint.sh가
# 채팅 모델과 별개로 이 모델을 pull해둔다는 전제(RAG_EMBEDDING_MODEL 환경변수와 이름을 맞춤).
rag.embedding.model=${RAG_EMBEDDING_MODEL:nomic-embed-text}
# "프로젝트 패키지 구조" 섹션의 예상 텍스트 크기(문자 수 근사치)가 이 값을 넘을 때만 압축 개입.
# 소형 프로젝트는 이 값 아래라 RAG가 전혀 개입하지 않는다(회귀 위험 최소화).
rag.trigger-threshold-chars=${RAG_TRIGGER_THRESHOLD_CHARS:20000}
# 압축 대상 패키지마다 임베딩 유사도 상위 몇 개 파일만 남길지
rag.top-k-per-package=${RAG_TOP_K_PER_PACKAGE:30}

# ===================================================================
# 3. 파일 분석 제어 및 비즈니스 룰 스펙 설정
# ===================================================================
# 파일 크기 제한 (사용 안 함 - 청킹으로 자동 처리)
# 무제한으로 설정 (청킹이 모든 크기 처리)
app.analysis.max-file-size-bytes=2147483647

# 대용량 폴더 분석 시 톰캣이 패킷을 자르지 않도록 POST 최대 용량 확장 (2GB)
server.tomcat.max-http-form-post-size=2GB

# ===================================================================
# 2.5 브라우저 폴더 업로드 분석 설정 (File System Access API 연동)
# ===================================================================
# 브라우저에서 업로드된 소스가 분석되는 동안 임시로 저장되는 경로
# 세션 하나당 하위 폴더(.uploads/{sessionId}/)가 생성되고, write-back 완료 후 정리됨
app.analysis.upload-storage-path=.uploads

# 폴더 통째 업로드 대비 멀티파트 요청 크기 제한
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# ===================================================================
# 3.5 병렬 분석 및 청킹 설정 (성능 튜닝)
# ===================================================================
# 병렬 처리 스레드 풀 크기 설정
# Claude API는 I/O 바운드이므로 CPU 코어 수와 무관하게 높게 설정 가능
# 0 = 자동 (코어수 × 2, 최소 8) / API 레이트 리밋 초과 시 줄일 것
app.analysis.thread-pool-size=16

# 파일 청킹 설정 (대용량 파일 처리)
# 한 청크당 처리할 줄 수
app.analysis.chunk-size-lines=1000

# 청크 사이의 겹침 줄 수 (맥락 유지)
app.analysis.chunk-overlap-lines=100

# 자동 청킹을 시작할 파일 크기 (바이트)
# 이 크기 이상의 파일만 청킹 처리
app.analysis.chunking-threshold-bytes=153600

# 시스템 프롬프트 base 파일 경로 설정
# base/role 분리(2026-08-11) 이후 base 파일 경로. 언어별 role 파일(prompts/roles/role-*.md)은
# 확장자 감지로 동적 병합되므로 별도 설정 없음(ClaudeServiceImpl.ROLE_FILE_BY_EXTENSION 참고).
# custom-spec-filename 설정은 2026-08-11 제거 — custom_spec.txt 및 관련 로드 코드가 실제
# 프롬프트 어디에도 삽입되지 않는 죽은 기능이라 파일·설정·코드 전부 제거함.
app.analysis.system-prompt-filename=prompts/prompt-base.md

# ===================================================================
# 4. Claude AI 정밀 모델 파라미터 제어 설정 (💡 추가된 영역)
# ===================================================================
# 호출할 Claude 인공지능 모델 버전 이름
anthropic.api.model=claude-sonnet-4-6

# AI 단일 응답당 최대 출력 허용 글자 수 (Token 단위 제한량)
# 256KB 파일 기준: 8192 tokens로 충분 (대부분의 파일 커버)
anthropic.api.max-tokens=8192

# ===================================================================
# 5. 에러 핸들링 및 재시도 설정 (성능 최적화)
# ===================================================================
# 최대 재시도 횟수 (2 → 1: 빠른 실패 처리, 실패 시 모의응답 사용)
app.analysis.max-retries=3

# 초기 재시도 대기 시간 (ms) (300 → 100: 매우 빠른 재시도)
app.analysis.initial-retry-delay-ms=100

# 최대 재시도 대기 시간 (ms) (5000 → 2000: 빠른 완료)
app.analysis.max-retry-delay-ms=2000

# 연결 타임아웃 (초) (5 → 3: 빠른 실패 감지)
app.analysis.connect-timeout-sec=10

# 읽기 타임아웃 (초) (15 → 10: Claude API 응답 대기 시간 단축)
app.analysis.read-timeout-sec=60

# ===================================================================
# 6. 세션 관리 및 진행 상황 저장 설정
# ===================================================================
# 세션 타임아웃 시간 (분)
app.analysis.session-timeout-minutes=240

# 자동 저장 간격 (초)
app.analysis.auto-save-interval-sec=30

# 세션 영속성 활성화 여부
app.analysis.enable-session-persistence=true

# 세션 저장 경로
app.analysis.session-storage-path=.analysis-sessions

# ===================================================================
# 7. 데이터베이스 설정
# ===================================================================
# Docker PostgreSQL 사용 시 postgres, 로컬 테스트 시 h2
spring.profiles.active=postgres

# ===================================================================
# 8. JWT 인증 설정
# ===================================================================
# JWT 비밀키 (최소 256비트 이상 권장)
jwt.secret-key=legacy-analyzer-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-security-2024

# JWT 토큰 유효기간 (밀리초) - 24시간 (테스트용)
jwt.expiration-ms=86400000

# ===================================================================
# 9. SSE 및 비동기 요청 타임아웃 설정 (중요!)
# ===================================================================
# SSE는 오래 유지되는 연결이므로 타임아웃을 충분히 길게 설정
# 분석 시간: 보통 5-10분, 최대 1시간
spring.mvc.async.request-timeout=3600000

# Tomcat 스레드 풀 설정 (동시 요청 처리)
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# ===================================================================
# 10. 로깅 설정
# ===================================================================
logging.level.com.legacy=DEBUG
logging.level.com.legacy.error=ERROR
logging.level.org.springframework.security=DEBUG
